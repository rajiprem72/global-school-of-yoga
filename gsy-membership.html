mode.addEventListener("change", function(){

  locationSelect.innerHTML =
    '<option value="">Select Location</option>';

  planSelect.innerHTML =
    '<option value="">Select Yoga Plan</option>';

  document.getElementById("feeSummary")
    .style.display = "none";

  Object.keys(dataMap[this.value]).forEach(function(loc){

    if(loc !== "Select Location"){

      let option =
        document.createElement("option");

      option.text = loc;

      option.value = loc;

      locationSelect.add(option);

    }

  });

});


// ==========================================
// LOCATION CHANGE
// ==========================================

locationSelect.addEventListener("change", function(){

  planSelect.innerHTML =
    '<option value="">Select Yoga Plan</option>';

  document.getElementById("feeSummary")
    .style.display = "none";

  const plans =
    dataMap[mode.value][this.value];

  if(plans){

    plans.forEach(function(plan){

      let option =
        document.createElement("option");

      option.text = plan;

      option.value = plan;

      planSelect.add(option);

    });

  }

});


// ==========================================
// PLAN CHANGE
// ==========================================

planSelect.addEventListener("change", function(){

  const selectedPlan =
    this.value;

  if(!selectedPlan){

    document.getElementById("feeSummary")
      .style.display = "none";

    return;
  }

  // ==========================================
  // REGISTRATION FEE
  // ==========================================

  let registrationFee = 0;

  if(mode.value === "Online"){

    if(locationSelect.value === "International"){

      registrationFee = 1000;

    }else{

      registrationFee = 500;
    }

  }else if(mode.value === "Yoga Studio"){

    registrationFee = 1500;

  }else if(mode.value === "Home Yoga"){

    registrationFee = 1000;
  }

  // ==========================================
  // COURSE FEE
  // ==========================================

  let courseFee = 0;

  const regex =
    /Rs\.?\s?([\d,]+)/i;

  const match =
    selectedPlan.match(regex);

  if(match){

    courseFee =
      parseInt(
        match[1].replace(/,/g,"")
      );
  }

  // ==========================================
  // TOTAL
  // ==========================================

  const totalFee =
    registrationFee + courseFee;

  // ==========================================
  // UPDATE UI
  // ==========================================

  document.getElementById("feeSummary")
    .style.display = "block";

  document.getElementById("registrationFee")
    .innerText = registrationFee;

  document.getElementById("courseFee")
    .innerText = courseFee;

  document.getElementById("totalFee")
    .innerText = totalFee;

});  
document.getElementById("yogaForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  try{

    // ======================================
    // PAYLOAD
    // ======================================

    const payload = {

      fullName:
        document.getElementById("fullName").value,

      age:
        document.getElementById("age").value,

      dob:
        document.getElementById("dob").value,

      mobile:
        document.getElementById("mobile").value,

      email:
        document.getElementById("email").value,

      address1:
        document.getElementById("address1").value,

      address2:
        document.getElementById("address2").value,

      pinCode:
        document.getElementById("pinCode").value,

      state:
        document.getElementById("state").value,

      country:
        document.getElementById("country").value,

      mode:
        mode.value,

      location:
        locationSelect.value,

      plan:
        planSelect.value
    };

    console.log("Payload:", payload);

    // ======================================
    // FETCH
    // ======================================

    const response = await fetch(SCRIPT_URL, {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body: JSON.stringify(payload)

    });

    console.log("Raw Response:", response);

    // ======================================
    // RAW TEXT FIRST
    // ======================================

    const rawText =
      await response.text();

    console.log("Raw Text:", rawText);

    // ======================================
    // JSON PARSE
    // ======================================

    const result =
      JSON.parse(rawText);

    console.log("Parsed Result:", result);

    // ======================================
    // SUCCESS
    // ======================================

    if(result.status === "success"){

      alert(
        "Data Stored Successfully"
      );

      const options = {

        key:
          "rzp_live_S3kealCGcLTw79",

        amount:
          result.totalAmount * 100,

        currency:
          "INR",

        name:
          "Global School of Yoga",

        description:
          result.participantId,

        handler: function(paymentResponse){

          alert(
            "Payment Successful\n\n" +
            paymentResponse
              .razorpay_payment_id
          );
        }

      };

      console.log("Opening Razorpay");

      const rzp =
        new Razorpay(options);

      rzp.open();

    }else{

      alert(
        "Server Error : " +
        result.message
      );
    }

  }catch(error){

    console.error(error);

    alert(
      "Javascript Error:\n\n" +
      error.message
    );
  }

});
