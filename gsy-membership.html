mode.addEventListener("change", function(){

  locationSelect.innerHTML = "";

  planSelect.innerHTML = "";

  Object.keys(dataMap[this.value]).forEach(function(loc){

    let option = document.createElement("option");

    option.text = loc;

    locationSelect.add(option);

  });

});

locationSelect.addEventListener("change", function(){

  planSelect.innerHTML = "";

  dataMap[mode.value][this.value]
    .forEach(function(plan){

      let option = document.createElement("option");

      option.text = plan;

      planSelect.add(option);

    });

});

document.getElementById("yogaForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const payload = {

    fullName:
      document.getElementById("fullName").value,

    age:
      document.getElementById("age").value,

    dob:
      document.getElementById("dob").value,

    mobile:
      document.getElementById("mobile").value,

    email:
      document.getElementById("email").value,

    address1:
      document.getElementById("address1").value,

    address2:
      document.getElementById("address2").value,

    pinCode:
      document.getElementById("pinCode").value,

    state:
      document.getElementById("state").value,

    country:
      document.getElementById("country").value,

    mode:
      mode.value,

    location:
      locationSelect.value,

    plan:
      planSelect.value
  };

  const response = await fetch(SCRIPT_URL, {

    method:"POST",

    body:JSON.stringify(payload)
  });

  const result = await response.json();

  if(result.status === "success"){

    const options = {

      key: "rzp_live_S3kealCGcLTw79",

      amount:
        result.totalAmount * 100,

      currency: "INR",

      name: "Global School of Yoga",

      description:
        result.participantId,

      handler: function (paymentResponse) {

        alert(
          "Payment Successful\nPayment ID: " +
          paymentResponse.razorpay_payment_id
        );
      }
    };

    const rzp =
      new Razorpay(options);

    rzp.open();
  }
});
