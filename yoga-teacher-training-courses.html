<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yoga Teacher Training Courses</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to bottom, #f8f9fa, #eef2f7);
      color:#222;
      overflow-x:hidden;
    }

    .main-container{
      width:100%;
      max-width:900px;
      margin:auto;
      background:#fff;
      box-shadow:0 0 25px rgba(0,0,0,0.08);
    }

    .course-section{
      padding-bottom:40px;
    }

    .course-image{
      width:100%;
      display:block;
    }

    .register-box{
      text-align:center;
      padding:30px 20px;
      background:#ffffff;
    }

    .register-btn{
      display:inline-block;
      background:linear-gradient(45deg,#ff7b00,#ffb300);
      color:#fff;
      text-decoration:none;
      padding:16px 38px;
      border-radius:50px;
      font-size:20px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 8px 20px rgba(255,123,0,0.3);
    }

    .register-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 25px rgba(255,123,0,0.45);
    }

    .separator{
      width:100%;
      border-top:6px dotted #d1d1d1;
      margin:20px 0 50px;
    }

    .additional-title{
      text-align:center;
      font-size:38px;
      font-weight:bold;
      color:#b36b00;
      margin-top:20px;
      margin-bottom:30px;
      padding:0 15px;
    }

    .extra-courses{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      padding:20px;
    }

    .extra-card{
      background:#fff;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .extra-card:hover{
      transform:translateY(-6px);
    }

    .extra-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .contact-box{
      margin:40px 20px 60px;
      padding:30px;
      background:linear-gradient(45deg,#ffe7c2,#fff5e6);
      border-radius:25px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    .contact-box h2{
      color:#b36b00;
      margin-bottom:15px;
      font-size:30px;
    }

    .contact-box p{
      font-size:20px;
      line-height:1.8;
      color:#444;
      font-weight:600;
    }

    .contact-box a{
      color:#d35400;
      text-decoration:none;
      font-weight:bold;
    }

    @media(max-width:768px){

      .register-btn{
        width:90%;
        font-size:18px;
      }

      .additional-title{
        font-size:28px;
      }

      .contact-box h2{
        font-size:24px;
      }

      .contact-box p{
        font-size:17px;
      }

    }
  </style>
</head>

<body>

  <div class="main-container">

    <!-- ===================================================== -->
    <!-- COURSE 1 -->
    <!-- ===================================================== -->

  </div>

</body>
</html>
